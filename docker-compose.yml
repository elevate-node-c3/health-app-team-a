services:
  postgres:
    # AddClinicSpatialIndex uses PostGIS (geography columns + GiST index), so
    # plain postgres:16 is not enough — this image bundles the extension.
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - health-app

  redis:
    image: redis:7-alpine
    # No AOF/RDB volume: this instance only holds short-TTL OTPs and a
    # regenerable Home cache, neither of which needs to survive a restart.
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --requirepass "$$REDIS_PASSWORD";
        else
          redis-server;
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG || redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - health-app

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # Management UI (guest/guest)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - health-app

  migrate:
    build: .
    env_file: .env
    environment:
      DB_HOST: postgres
    command: ['npm', 'run', 'migration:run:prod']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks:
      - health-app

  app:
    build: .
    env_file: .env
    environment:
      # Service dependencies are reached by Compose network name here;
      # .env keeps `localhost` for running the app directly on the host.
      DB_HOST: postgres
      REDIS_HOST: redis
      RABBITMQ_URL: amqp://rabbitmq:5672
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - health-app

networks:
  health-app:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
